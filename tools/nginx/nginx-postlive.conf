# PostLive 本地观看（HLS 静态分发）
#
# 用法：把本文件复制为 C:\Tools\nginx-1.30.6\conf\nginx.conf（覆盖前备份原
# 文件），把 player.html 放到 PostLive 可执行目录的 hls\ 子目录，然后在
# nginx 目录执行 `start nginx.exe`。
#
# 客户端：设置 → 勾选"本地 HLS 输出"，开播后浏览器打开
#   http://localhost:18080/player.html

worker_processes 1;
error_log logs/error.log;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    server {
        listen 18080;

        # 指向 PostLive 可执行目录下的 hls 文件夹（按实际安装位置调整）
        root "C:/Users/OhtoAi/source/repos/PostLive.old/build/windows-x64/Release/hls";

        location = / {
            return 302 /player.html;
        }

        location ~* \.m3u8$ {
            add_header Cache-Control no-cache;
        }
        location ~* \.ts$ {
            add_header Cache-Control no-cache;
        }
        location = /player.html {
            add_header Cache-Control no-cache;
        }
    }
}
