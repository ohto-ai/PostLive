name: Build

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64 (Qt 5.15.2)
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Qt 5.15.2
        uses: jurplel/install-qt-action@v4
        with:
          version: "5.15.2"
          arch: win64_msvc2019_64
          cache: true

      - name: Configure
        run: |
          $env:QT_ROOT = $env:QT_ROOT_DIR
          cmake --preset windows-x64

      - name: Build
        run: cmake --build --preset release --parallel

      - name: Run tests
        run: ctest --preset windows-x64

      - name: Deploy Qt runtime
        run: cmake --build build/windows-x64 --config Release --target deploy-qt

      - name: Fetch OpenSSL 1.1.1 runtime
        run: |
          # Third-party host (slproweb.com): pin the SHA256 observed on 2026-11-05
          # so a silent upstream change can never ship into the installer.
          $opensslUri = "https://slproweb.com/download/Win64OpenSSL_Light-1_1_1w.exe"
          $opensslSha256 = "82FC564EFC673BE043DAC12BAEFC5F4D3276A7E11B222D0F948A70C7367DD162"
          Invoke-WebRequest -Uri $opensslUri -OutFile "$env:RUNNER_TEMP\openssl-setup.exe"
          $hash = (Get-FileHash "$env:RUNNER_TEMP\openssl-setup.exe" -Algorithm SHA256).Hash
          if ($hash -ne $opensslSha256) { throw "OpenSSL installer SHA256 mismatch: got $hash" }
          Start-Process "$env:RUNNER_TEMP\openssl-setup.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=$env:RUNNER_TEMP\openssl" -Wait
          $dlls = Get-ChildItem "$env:RUNNER_TEMP\openssl" -Recurse -Include "libcrypto-1_1-x64.dll","libssl-1_1-x64.dll"
          if ($dlls.Count -lt 2) { throw "OpenSSL 1.1 DLLs not found in the installer output" }
          Copy-Item $dlls.FullName -Destination build\windows-x64\Release\

      - name: Package
        run: |
          $files = Get-ChildItem build\windows-x64\Release |
            Where-Object { $_.Name -ne 'PostLiveMockServer.exe' }
          Compress-Archive -Path $files.FullName -DestinationPath PostLive-win64.zip

      - name: Build installer
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = (Get-Command iscc.exe -ErrorAction Stop).Source }
          # Select-String matches per line, so anchor the VERSION line itself
          # (project() spans multiple lines and cannot be matched cross-line).
          $match = Select-String -Path CMakeLists.txt -Pattern '^\s*VERSION\s+(\d+(?:\.\d+)+)'
          if (@($match).Count -ne 1) { throw "Expected exactly one VERSION line in CMakeLists.txt, got $(@($match).Count)" }
          $version = $match.Matches[0].Groups[1].Value
          & $iscc "/DMyAppVersion=$version" "packaging\PostLive.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: PostLive-win64
          path: |
            PostLive-win64.zip
            dist/PostLive-*-setup.exe
          if-no-files-found: error

  worker:
    name: Auth worker tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run worker tests
        run: node --test
        working-directory: worker
