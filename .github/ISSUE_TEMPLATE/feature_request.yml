name: Feature request
description: 建议新功能或改进
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        请先查看 [TODO.md](https://github.com/ohto-ai/PostLive/blob/master/TODO.md)，避免重复。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前哪里不方便？在什么场景下需要这个功能？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 可以描述 UI、配置项、FFmpeg 参数或 API 变化。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 有没有更简单或更通用的做法？

  - type: checkboxes
    id: scope
    attributes:
      label: 影响范围
      options:
        - label: 登录 / 认证
        - label: 摄像头 / 麦克风
        - label: 推流 / FFmpeg
        - label: 设置 / 托盘 / 界面
        - label: 构建 / 打包 / 文档
